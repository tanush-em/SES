[project]
name = "ses-cli"
version = "1.0.0"
description = "Solo Engineering System CLI (ses init, ses setup, ses check)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "build", "twine"]

[project.scripts]
ses = "ses_cli.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ses_cli = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
